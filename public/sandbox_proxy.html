<!doctype html>
<!--
  MCP-UI sandbox proxy for interactive chat messages (Slice 1, Phase 5).

  SOURCE: the official @mcp-ui/client proxy
  (monorepo: sdks/typescript/client/scripts/proxy/index.html). It is NOT bundled
  in the npm package, so it is vendored here.

  BEFORE ENABLING NEXT_PUBLIC_FEATURE_CHAT_UI IN PRODUCTION:
   1. Re-fetch this file from the @mcp-ui/client release that matches the installed
      version (currently 7.1.1) to confirm the AppBridge postMessage protocol matches.
   2. Host it on a SEPARATE ORIGIN from the app and point NEXT_PUBLIC_CHAT_SANDBOX_URL
      at it. The copy in /public is the dev-only, same-origin fallback. Same-origin
      hosting does NOT fully isolate untrusted producers — see the spec's security model.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>MCP-UI Proxy</title>
    <style>
      html, body { margin: 0; height: 100vh; width: 100vw; }
      body { display: flex; flex-direction: column; }
      * { box-sizing: border-box; }
      iframe { background-color: transparent; border: 0px none transparent; padding: 0px; overflow: hidden; flex-grow: 1; }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const contentType = params.get('contentType');
      const target = params.get('url');

      function isValidHttpUrl(string) {
        try {
          const url = new URL(string);
          return url.protocol === 'http:' || url.protocol === 'https:';
        } catch (e) { return false; }
      }

      if (contentType === 'rawhtml') {
        const inner = document.createElement('iframe');
        inner.id = 'root';
        let pendingHtml = null;

        const renderHtmlInIframe = (markup) => {
          const doc = inner.contentDocument || inner.contentWindow?.document;
          if (!doc) return false;
          try { doc.open(); doc.write(markup); doc.close(); return true; }
          catch (e) { return false; }
        };

        inner.addEventListener('load', () => {
          if (pendingHtml !== null && renderHtmlInIframe(pendingHtml)) pendingHtml = null;
        });

        inner.style = 'width:100%; height:100%; border:none;';
        inner.src = 'about:blank';
        document.body.appendChild(inner);

        window.addEventListener('message', (event) => {
          if (event.source === window.parent && event.data?.type === 'ui-html-content') {
            const html = event.data.payload?.html;
            if (typeof html === 'string') {
              if (!renderHtmlInIframe(html)) pendingHtml = html;
            }
          } else if (event.source === window.parent) {
            inner?.contentWindow?.postMessage(event.data, '*');
          } else if (event.source === inner.contentWindow) {
            window.parent.postMessage(event.data, '*');
          }
        });

        window.parent.postMessage({ type: 'ui-proxy-iframe-ready' }, '*');
      } else if (target) {
        if (!isValidHttpUrl(target)) {
          document.body.textContent = 'Error: invalid URL.';
        } else {
          const inner = document.createElement('iframe');
          inner.src = target;
          inner.style = 'width:100%; height:100%; border:none;';
          inner.setAttribute('sandbox', 'allow-same-origin allow-scripts');
          document.body.appendChild(inner);
          const urlOrigin = new URL(target).origin;
          window.addEventListener('message', (event) => {
            if (event.source === window.parent) {
              inner.contentWindow.postMessage(event.data, urlOrigin);
            } else if (event.source === inner.contentWindow) {
              window.parent.postMessage(event.data, '*');
            }
          });
        }
      }
    </script>
  </body>
</html>
