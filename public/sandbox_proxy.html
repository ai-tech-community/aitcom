<!doctype html>
<!--
  MCP-Apps sandbox proxy for interactive chat messages (Slice 1, Phase 5).

  Implements the MCP Apps "Sandbox proxy" protocol (spec 2026-01-26,
  modelcontextprotocol/ext-apps). This is a faithful, dependency-free port of the
  official reference (ext-apps examples/basic-host/src/sandbox.ts):

    1. On load, send `ui/notifications/sandbox-proxy-ready` to the host.
    2. On `ui/notifications/sandbox-resource-ready` { html, sandbox?, permissions? },
       load the View HTML into an INNER iframe via document.write.
    3. Relay every other message host<->view (the View speaks MCP-like JSON-RPC:
       ui/initialize -> ui/notifications/initialized -> ui/message, tools/call, ...).

  SECURITY MODEL: the Host and this Sandbox MUST be different origins. The outer
  iframe (created by @mcp-ui/client AppFrame) is `allow-scripts allow-same-origin
  allow-forms` -- isolation comes from the SEPARATE ORIGIN, not from dropping
  allow-same-origin. Host origin is pinned from document.referrer and all
  postMessages are origin-scoped.

  NOTE (follow-up): per-trust CSP enforcement on the inner View is NOT yet applied
  in this render path (see src/lib/chat/trust.ts + /api/inbox/ui-csp). Wire that
  before enabling CHAT_UI in production.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>MCP-UI Sandbox Proxy</title>
    <style>
      html, body { margin: 0; height: 100vh; width: 100vw; }
      body { display: flex; flex-direction: column; }
      * { box-sizing: border-box; }
      iframe { background-color: transparent; border: 0 none transparent; padding: 0; overflow: hidden; flex-grow: 1; }
    </style>
  </head>
  <body>
    <script>
      // Host origins allowed to embed this proxy. Add the production app origin
      // here (e.g. https://app.example.com) alongside localhost + Vercel previews.
      var ALLOWED_HOST_ORIGIN = [
        /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/,
        /^https:\/\/([a-z0-9-]+\.)*vercel\.app$/,
      ];

      if (window.self === window.top) {
        throw new Error("This file is only to be used in an iframe sandbox.");
      }
      if (!document.referrer) {
        throw new Error("No referrer, cannot validate embedding site.");
      }

      var EXPECTED_HOST_ORIGIN = new URL(document.referrer).origin;
      var OWN_ORIGIN = new URL(window.location.href).origin;

      if (!ALLOWED_HOST_ORIGIN.some(function (re) { return re.test(EXPECTED_HOST_ORIGIN); })) {
        throw new Error("Embedding origin not allowed: " + EXPECTED_HOST_ORIGIN);
      }

      // Security self-test: cross-origin window.top access MUST throw. If it does
      // not, the sandbox is misconfigured and untrusted content could escape.
      try {
        window.top.alert("If you see this, the sandbox is not setup securely.");
        throw "FAIL";
      } catch (e) {
        if (e === "FAIL") throw new Error("The sandbox is not setup securely.");
      }

      var RESOURCE_READY = "ui/notifications/sandbox-resource-ready";
      var PROXY_READY = "ui/notifications/sandbox-proxy-ready";

      // Inner iframe holding the untrusted View HTML.
      var inner = document.createElement("iframe");
      inner.style = "width:100%; height:100%; border:none;";
      inner.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
      document.body.appendChild(inner);

      function writeHtml(markup) {
        try {
          var doc = inner.contentDocument || (inner.contentWindow && inner.contentWindow.document);
          if (doc) { doc.open(); doc.write(markup); doc.close(); return; }
        } catch (e) { /* fall through */ }
        inner.srcdoc = markup;
      }

      window.addEventListener("message", function (event) {
        if (event.source === window.parent) {
          if (event.origin !== EXPECTED_HOST_ORIGIN) return;

          if (event.data && event.data.method === RESOURCE_READY) {
            var p = event.data.params || {};
            if (typeof p.sandbox === "string") inner.setAttribute("sandbox", p.sandbox);
            if (p.permissions && typeof p.permissions === "object") {
              // best-effort Permissions-Policy allow attribute
              var allow = Object.keys(p.permissions)
                .filter(function (k) { return p.permissions[k]; })
                .join("; ");
              if (allow) inner.setAttribute("allow", allow);
            }
            if (typeof p.html === "string") writeHtml(p.html);
            return; // intercepted, not relayed
          }
          // Relay host -> view.
          if (inner.contentWindow) inner.contentWindow.postMessage(event.data, "*");
        } else if (event.source === inner.contentWindow) {
          if (event.origin !== OWN_ORIGIN && event.origin !== "null") return;
          // Relay view -> host (origin-scoped).
          window.parent.postMessage(event.data, EXPECTED_HOST_ORIGIN);
        }
      });

      // Tell the host we're ready to receive the View HTML.
      window.parent.postMessage(
        { jsonrpc: "2.0", method: PROXY_READY, params: {} },
        EXPECTED_HOST_ORIGIN
      );
    </script>
  </body>
</html>
