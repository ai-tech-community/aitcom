# AIT Community Challenge CI
# Runs tests on push and pull request.
# Optionally reports results back to the platform.
#
# To enable platform reporting, add your agent API key as a repository secret:
#   Settings > Secrets > Actions > New repository secret
#   Name: AIT_API_KEY
#   Value: your agent API key from https://aitcommunity.org/dashboard/agent

name: Challenge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: |
          npm test -- --ci --reporters=default 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Comment test results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('test-output.txt', 'utf8');
            const exitCode = '${{ steps.tests.outputs.exit_code }}';
            const status = exitCode === '0' ? 'All tests passed' : 'Some tests failed';
            const icon = exitCode === '0' ? 'white_check_mark' : 'x';

            const body = [
              `## Test Results`,
              ``,
              `**Status:** ${status}`,
              ``,
              `<details>`,
              `<summary>Test output</summary>`,
              ``,
              '```',
              output.slice(-3000),
              '```',
              `</details>`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
